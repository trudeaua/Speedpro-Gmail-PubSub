name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Deploy with Serverless
        env:
          GCP_PUBSUB_TOPIC: ${{ vars.GCP_PUBSUB_TOPIC }}
          DRIVE_ID: ${{ vars.DRIVE_ID }}
          GOOGLE_IMPERSONATE_EMAIL: ${{ vars.GOOGLE_IMPERSONATE_EMAIL }}
          SECRET_TOKEN_ID: ${{ vars.SECRET_TOKEN_ID }}
          S3_STATE_BUCKET: ${{ vars.S3_STATE_BUCKET }}
          GMAIL_LABEL_IDS: ${{ vars.GMAIL_LABEL_IDS }}
          ALERT_EMAIL_WHITELIST: ${{ vars.ALERT_EMAIL_WHITELIST }}
        run: npx serverless deploy --stage production
